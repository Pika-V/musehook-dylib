name: build-musehook-dylib

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Test player observers and downloads
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          player_test = r'''
          #import <Foundation/Foundation.h>
          #include <objc/runtime.h>
          #include <objc/message.h>
          #include <stdatomic.h>
          #include <stdio.h>
          #include <stdlib.h>

          static _Atomic(BOOL) gReady;
          static NSMutableArray *gCandidates;
          static NSMutableSet *gSeenURLs;
          static NSString *gLogPath = @"/test/Documents/暮色下载/hook.log";
          static NSString *out_dir(void) { return @"/test/Documents/暮色下载"; }
          static id add_candidate(NSString *url, NSString *title, NSDictionary *headers) {
              if ([gSeenURLs containsObject:url]) return nil;
              [gSeenURLs addObject:url];
              NSDictionary *candidate = @{@"url": url, @"title": title ?: @"", @"headers": headers ?: @{}};
              [gCandidates addObject:candidate];
              return candidate;
          }

          @interface TestCall : NSObject
          @property NSString *method;
          @property id arguments;
          @end
          @implementation TestCall
          @end

          __attribute__((objc_runtime_name("_TtC18better_player_plus18BetterPlayerPlugin")))
          @interface TestBetterPlayerPlugin : NSObject
          - (void)handleMethodCall:(id)call result:(void (^)(id))result;
          @end
          static NSUInteger gOriginalBetterCalls;
          @implementation TestBetterPlayerPlugin
          - (void)handleMethodCall:(id)call result:(void (^)(id))result {
              gOriginalBetterCalls++;
              if (result) result(@YES);
          }
          @end

          @interface FSPlayer : NSObject
          @property NSURL *contentURL;
          - (instancetype)initWithContentURL:(NSURL *)url withOptions:(id)options;
          - (void)prepareToPlay;
          - (void)play;
          @end
          static NSUInteger gOriginalFSPlayCalls;
          static NSUInteger gOriginalFSPrepareCalls;
          @implementation FSPlayer
          - (instancetype)initWithContentURL:(NSURL *)url withOptions:(id)options {
              if ((self = [super init])) self.contentURL = url;
              return self;
          }
          - (void)play { gOriginalFSPlayCalls++; }
          - (void)prepareToPlay { gOriginalFSPrepareCalls++; }
          @end

          @interface AVURLAsset : NSObject
          @property NSURL *URL;
          - (instancetype)initWithURL:(NSURL *)url options:(NSDictionary *)options;
          @end
          @implementation AVURLAsset
          - (instancetype)initWithURL:(NSURL *)url options:(NSDictionary *)options {
              if ((self = [super init])) self.URL = url;
              return self;
          }
          @end

          @interface TestPlayerItem : NSObject
          @property id asset;
          @end
          @implementation TestPlayerItem
          @end

          @interface AVPlayer : NSObject
          @property id currentItem;
          - (void)play;
          - (void)replaceCurrentItemWithPlayerItem:(id)item;
          @end
          static NSUInteger gOriginalAVPlayCalls;
          static NSUInteger gOriginalAVReplaceCalls;
          @implementation AVPlayer
          - (void)play { gOriginalAVPlayCalls++; }
          - (void)replaceCurrentItemWithPlayerItem:(id)item {
              gOriginalAVReplaceCalls++;
              self.currentItem = item;
          }
          @end

          #include "player-capture.inc"

          static void require(BOOL condition, NSString *message) {
              if (!condition) {
                  fprintf(stderr, "FAIL: %s\n", message.UTF8String);
                  exit(1);
              }
          }
          static void flush(void) { dispatch_sync(gMediaCaptureQueue, ^{}); }

          int main(void) {
              @autoreleasepool {
                  gCandidates = [NSMutableArray new];
                  gSeenURLs = [NSMutableSet new];
                  muse_media_capture_start();
                  require(atomic_load(&gMediaHooksInstalled) == 5, @"all player observers installed");
                  gReady = YES;
                  TestBetterPlayerPlugin *plugin = [TestBetterPlayerPlugin new];
                  TestCall *call = [TestCall new];
                  call.method = @"setDataSource";
                  NSString *hls = @"https://cdn.example/index.m3u8?sig=a%2Fb+c";
                  NSDictionary *headers = @{@"Referer": @"https://site.example/", @"User-Agent": @"PlayerUA"};
                  call.arguments = @{@"dataSource": @{@"uri": hls, @"title": @"中文视频", @"headers": headers,
                                                      @"licenseUrl": @"https://license.example/request"}};
                  __block BOOL replied = NO;
                  [plugin handleMethodCall:call result:^(id value) { replied = [value boolValue]; }];
                  flush();
                  require(replied && gOriginalBetterCalls == 1, @"original Flutter callback preserved");
                  require(gCandidates.count == 1, @"one player source; license URL excluded");
                  require([gCandidates[0][@"url"] isEqual:hls], @"signed URL preserved");
                  require([gCandidates[0][@"headers"] isEqual:headers], @"player headers captured");
                  require([gCandidates[0][@"title"] isEqual:@"中文视频"], @"player title captured");
                  NSString *mp4 = @"https://cdn.example/video.mp4?token=a%2Bb";
                  FSPlayer *fs = [[FSPlayer alloc] initWithContentURL:[NSURL URLWithString:mp4] withOptions:nil];
                  [fs prepareToPlay];
                  [fs play];
                  flush();
                  require(gOriginalFSPlayCalls == 1 && gOriginalFSPrepareCalls == 1 && gCandidates.count == 2, @"FSPlayer URL and original prepare/play preserved");
                  NSString *proxy = @"http://localhost:6006/parse?topicId=123";
                  AVURLAsset *asset = [[AVURLAsset alloc] initWithURL:[NSURL URLWithString:proxy]
                                                           options:@{@"AVURLAssetHTTPHeaderFieldsKey": headers}];
                  TestPlayerItem *item = [TestPlayerItem new];
                  item.asset = asset;
                  AVPlayer *player = [AVPlayer new];
                  [player replaceCurrentItemWithPlayerItem:item];
                  [player play];
                  flush();
                  require(gOriginalAVPlayCalls == 1 && gOriginalAVReplaceCalls == 1 && gCandidates.count == 3, @"extensionless proxy and original AVPlayer calls preserved");
                  call.method = @"launchUrl";
                  call.arguments = @{@"url": @"https://site.example/page"};
                  [plugin handleMethodCall:call result:nil];
                  flush();
                  require(gCandidates.count == 3, @"unrelated method ignored");
                  NSString *report = muse_diagnostic_report();
                  require([report containsString:@"5/5"] && [report containsString:gLogPath], @"visible observer and log diagnostics");
                  puts("PASS: player observers, original calls, signed URLs, headers, direct MP4 and proxy sources");
              }
              return 0;
          }
          '''

          download_test = r'''
          #import <Foundation/Foundation.h>
          #include <CommonCrypto/CommonCryptor.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdarg.h>
          #include <string.h>

          typedef NS_ENUM(NSInteger, CandStatus) { CandIdle, CandRunning, CandDone, CandFailed };
          @interface MuseCandidate : NSObject
          @property (atomic, copy) NSString *url;
          @property (atomic, copy) NSString *title;
          @property (atomic, copy) NSDictionary *headers;
          @property (atomic, copy) NSString *errorText;
          @property (atomic, assign) CandStatus status;
          @property (atomic, assign) double progress;
          @property (atomic, assign) BOOL isFmp4;
          @end
          @implementation MuseCandidate
          @end

          static NSString *testOutputRoot;
          static NSLock *gLock;
          static NSString *out_dir(void) { return testOutputRoot; }
          static void notify_list_changed(void) {}
          static void mlog(NSString *format, ...) {
              va_list arguments;
              va_start(arguments, format);
              NSString *message = [[NSString alloc] initWithFormat:format arguments:arguments];
              va_end(arguments);
              fprintf(stderr, "%s\n", message.UTF8String);
          }

          #include "download-core.inc"

          static void require(BOOL condition, NSString *message) {
              if (!condition) { fprintf(stderr, "FAIL: %s\n", message.UTF8String); exit(1); }
          }

          static NSData *box(const char *type, NSData *payload) {
              uint32_t length = (uint32_t)payload.length + 8;
              unsigned char header[8] = {
                  (unsigned char)(length >> 24), (unsigned char)(length >> 16),
                  (unsigned char)(length >> 8), (unsigned char)length, 0, 0, 0, 0
              };
              memcpy(header + 4, type, 4);
              NSMutableData *data = [NSMutableData dataWithBytes:header length:8];
              [data appendData:payload];
              return data;
          }

          static NSData *joined(NSArray<NSData *> *parts) {
              NSMutableData *data = [NSMutableData data];
              for (NSData *part in parts) [data appendData:part];
              return data;
          }

          static NSData *transport(unsigned char fill) {
              NSMutableData *data = [NSMutableData dataWithLength:188 * 2];
              memset(data.mutableBytes, fill, data.length);
              ((unsigned char *)data.mutableBytes)[0] = 0x47;
              ((unsigned char *)data.mutableBytes)[188] = 0x47;
              return data;
          }

          static NSData *encrypted(NSData *clear, NSData *key, uint64_t sequence) {
              unsigned char iv[16] = {0};
              for (int index = 15; index >= 8; index--) { iv[index] = (unsigned char)sequence; sequence >>= 8; }
              NSMutableData *cipher = [NSMutableData dataWithLength:clear.length + 16];
              size_t count = 0;
              CCCryptorStatus status = CCCrypt(kCCEncrypt, kCCAlgorithmAES128, kCCOptionPKCS7Padding,
                                               key.bytes, key.length, iv, clear.bytes, clear.length,
                                               cipher.mutableBytes, cipher.length, &count);
              require(status == kCCSuccess, @"generate AES fixture");
              cipher.length = count;
              return cipher;
          }

          static MuseCandidate *download(NSString *base, NSString *path, NSString *title, NSDictionary *headers) {
              MuseCandidate *candidate = [MuseCandidate new];
              candidate.url = [base stringByAppendingString:path];
              candidate.title = title;
              candidate.headers = headers ?: @{};
              [[MuseDl shared] downloadCandidate:candidate];
              return candidate;
          }

          static NSArray<NSString *> *finalFiles(NSString *title) {
              NSString *directory = [testOutputRoot stringByAppendingPathComponent:title];
              NSMutableArray *paths = [NSMutableArray array];
              for (NSString *name in [NSFileManager.defaultManager contentsOfDirectoryAtPath:directory error:NULL]) {
                  if ([@[@"ts", @"mp4"] containsObject:name.pathExtension])
                      [paths addObject:[directory stringByAppendingPathComponent:name]];
              }
              return paths;
          }

          static void expectSuccess(MuseCandidate *candidate, NSData *expected) {
              require(candidate.status == CandDone && candidate.progress == 1, candidate.errorText ?: @"download status");
              NSArray *files = finalFiles(candidate.title);
              require(files.count == 1, @"one complete published file");
              NSData *actual = [NSData dataWithContentsOfFile:files.firstObject];
              require([actual isEqual:expected], [@"downloaded bytes mismatch: " stringByAppendingString:candidate.title]);
          }

          static void expectFailure(MuseCandidate *candidate) {
              require(candidate.status == CandFailed && candidate.errorText.length && candidate.progress == 0, @"failure state/error");
              require(finalFiles(candidate.title).count == 0, @"failed download published a media file");
          }

          int main(int argc, const char *argv[]) {
              @autoreleasepool {
                  require(argc == 4, @"arguments: base URL, fixtures directory, output directory");
                  NSString *base = [NSString stringWithUTF8String:argv[1]];
                  NSString *fixtures = [NSString stringWithUTF8String:argv[2]];
                  testOutputRoot = [NSString stringWithUTF8String:argv[3]];
                  gLock = [NSLock new];
                  [NSFileManager.defaultManager createDirectoryAtPath:fixtures withIntermediateDirectories:YES attributes:nil error:NULL];
                  [NSFileManager.defaultManager createDirectoryAtPath:testOutputRoot withIntermediateDirectories:YES attributes:nil error:NULL];
                  NSData *first = transport(0x11);
                  NSData *second = transport(0x22);
                  NSData *expectedTS = joined(@[first, second]);
                  [first writeToFile:[fixtures stringByAppendingPathComponent:@"ts0.bin"] atomically:YES];
                  [second writeToFile:[fixtures stringByAppendingPathComponent:@"ts1.bin"] atomically:YES];
                  NSData *type = box("ftyp", [@"isom0000" dataUsingEncoding:NSASCIIStringEncoding]);
                  NSData *movie = box("moov", NSData.data);
                  NSData *media = box("mdat", [@"synthetic media fixture" dataUsingEncoding:NSASCIIStringEncoding]);
                  NSData *mp4 = joined(@[type, movie, media]);
                  [mp4 writeToFile:[fixtures stringByAppendingPathComponent:@"movie.mp4"] atomically:YES];
                  NSData *initialization = joined(@[type, movie]);
                  NSData *fragment0 = joined(@[box("moof", NSData.data), box("mdat", first)]);
                  NSData *fragment1 = joined(@[box("moof", NSData.data), box("mdat", second)]);
                  [initialization writeToFile:[fixtures stringByAppendingPathComponent:@"init.bin"] atomically:YES];
                  [fragment0 writeToFile:[fixtures stringByAppendingPathComponent:@"fragment0.bin"] atomically:YES];
                  [fragment1 writeToFile:[fixtures stringByAppendingPathComponent:@"fragment1.bin"] atomically:YES];
                  NSData *expectedMP4 = joined(@[initialization, fragment0, fragment1]);
                  unsigned char keyBytes[16];
                  for (int index = 0; index < 16; index++) keyBytes[index] = (unsigned char)index;
                  NSData *key = [NSData dataWithBytes:keyBytes length:16];
                  [key writeToFile:[fixtures stringByAppendingPathComponent:@"key.bin"] atomically:YES];
                  [encrypted(first, key, 123456789012) writeToFile:[fixtures stringByAppendingPathComponent:@"encrypted0.bin"] atomically:YES];
                  [encrypted(second, key, 123456789013) writeToFile:[fixtures stringByAppendingPathComponent:@"encrypted1.bin"] atomically:YES];

                  expectSuccess(download(base, @"/redirect/start.m3u8", @"redirect", nil), expectedTS);
                  expectSuccess(download(base, @"/headers/list.m3u8", @"headers",
                                         @{@"Authorization": @"Bearer fixture", @"User-Agent": @"FixturePlayer"}), first);
                  expectFailure(download(base, @"/headers/list.m3u8", @"headers-denied", nil));
                  expectSuccess(download(base, @"/mp4", @"direct", nil), mp4);
                  expectSuccess(download(base, @"/aes/list.m3u8", @"aes", nil), expectedTS);
                  expectFailure(download(base, @"/broken/list.m3u8", @"missing", nil));
                  expectFailure(download(base, @"/false/list.m3u8", @"false-200", nil));
                  expectSuccess(download(base, @"/range/list.m3u8", @"range", nil), expectedMP4);
                  expectSuccess(download(base, @"/range-ignore/list.m3u8", @"range-ignore", nil), expectedMP4);
                  expectFailure(download(base, @"/range-wrong/list.m3u8", @"range-wrong", nil));
                  expectFailure(download(base, @"/text", @"not-media", nil));
                  MuseCandidate *one = download(base, @"/mp4?one", @"collision", nil);
                  MuseCandidate *two = download(base, @"/mp4?two", @"collision", nil);
                  require(one.status == CandDone && two.status == CandDone && finalFiles(@"collision").count == 2,
                          @"completed files must be preserved on filename collision");
                  puts("PASS: download fixtures (redirects, headers, MP4, AES sequence, missing pieces, ranges, false-200 and file publication)");
              }
              return 0;
          }
          '''

          server = r'''
          import argparse
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import re


          parser = argparse.ArgumentParser()
          parser.add_argument("--fixtures", type=Path, required=True)
          parser.add_argument("--port-file", type=Path, required=True)
          args = parser.parse_args()


          class Handler(BaseHTTPRequestHandler):
              def log_message(self, *unused):
                  pass

              def send(self, body, content_type="application/octet-stream", status=200, extra=None):
                  self.send_response(status)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  for name, value in (extra or {}).items():
                      self.send_header(name, value)
                  self.end_headers()
                  self.wfile.write(body)

              def playlist(self, text):
                  self.send(text.encode(), "application/vnd.apple.mpegurl")

              def fixture(self, name):
                  return (args.fixtures / name).read_bytes()

              def do_GET(self):
                  path = self.path.split("?", 1)[0]
                  if path.startswith("/headers/"):
                      if (self.headers.get("Authorization") != "Bearer fixture" or
                              self.headers.get("User-Agent") != "FixturePlayer"):
                          self.send(b"denied", "text/plain", 403)
                          return
                  if path == "/redirect/start.m3u8":
                      self.send(b"", status=302, extra={"Location": "/deep/master.m3u8"})
                  elif path == "/deep/master.m3u8":
                      self.playlist("#EXTM3U\n#EXT-X-STREAM-INF:BANDWIDTH=10\nvideo/list.m3u8\n")
                  elif path == "/deep/video/list.m3u8":
                      self.playlist("#EXTM3U\n#EXTINF:1,\ns0.ts\n#EXTINF:1,\ns1.ts\n#EXT-X-ENDLIST\n")
                  elif path == "/deep/video/s0.ts":
                      self.send(self.fixture("ts0.bin"), "video/mp2t")
                  elif path == "/deep/video/s1.ts":
                      self.send(self.fixture("ts1.bin"), "video/mp2t")
                  elif path == "/headers/list.m3u8":
                      self.playlist("#EXTM3U\n#EXTINF:1,\nt0.ts\n#EXT-X-ENDLIST\n")
                  elif path == "/headers/t0.ts":
                      self.send(self.fixture("ts0.bin"), "video/mp2t")
                  elif path == "/mp4":
                      self.send(self.fixture("movie.mp4"), "video/mp4")
                  elif path == "/aes/list.m3u8":
                      self.playlist("#EXTM3U\n#EXT-X-MEDIA-SEQUENCE:123456789012\n"
                                    "#EXT-X-KEY:METHOD=AES-128,URI=\"key.bin\"\n"
                                    "#EXTINF:1,\ns0.ts\n#EXTINF:1,\ns1.ts\n#EXT-X-ENDLIST\n")
                  elif path == "/aes/key.bin":
                      self.send(self.fixture("key.bin"))
                  elif path in ("/aes/s0.ts", "/aes/s1.ts"):
                      self.send(self.fixture("encrypted" + path[-4] + ".bin"))
                  elif path == "/broken/list.m3u8":
                      self.playlist("#EXTM3U\n#EXTINF:1,\ngood.ts\n#EXTINF:1,\nmissing.ts\n#EXT-X-ENDLIST\n")
                  elif path == "/broken/good.ts":
                      self.send(self.fixture("ts0.bin"), "video/mp2t")
                  elif path == "/false/list.m3u8":
                      self.playlist("#EXTM3U\n#EXTINF:1,\ngood.ts\n#EXTINF:1,\nlogin.ts\n#EXT-X-ENDLIST\n")
                  elif path == "/false/good.ts":
                      self.send(self.fixture("ts0.bin"), "video/mp2t")
                  elif path == "/false/login.ts":
                      self.send(b"<html>please login</html>", "text/html")
                  elif path.endswith("/list.m3u8") and path.startswith(("/range/", "/range-ignore/", "/range-wrong/")):
                      init = self.fixture("init.bin")
                      first = self.fixture("fragment0.bin")
                      second = self.fixture("fragment1.bin")
                      self.playlist(
                          "#EXTM3U\n#EXT-X-MAP:URI=\"resource.bin\",BYTERANGE=\"%d@0\"\n"
                          "#EXT-X-BYTERANGE:%d@%d\n#EXTINF:1,\nresource.bin\n"
                          "#EXT-X-BYTERANGE:%d\n#EXTINF:1,\nresource.bin\n#EXT-X-ENDLIST\n" %
                          (len(init), len(first), len(init), len(second))
                      )
                  elif path.endswith("/resource.bin"):
                      body = self.fixture("init.bin") + self.fixture("fragment0.bin") + self.fixture("fragment1.bin")
                      match = re.fullmatch(r"bytes=(\d+)-(\d+)", self.headers.get("Range", ""))
                      if path.startswith("/range-ignore/") or not match:
                          self.send(body)
                      else:
                          start, end = map(int, match.groups())
                          selected = body[start:end + 1]
                          reported_start = start + 1 if path.startswith("/range-wrong/") else start
                          self.send(selected, status=206, extra={
                              "Content-Range": f"bytes {reported_start}-{end}/{len(body)}"
                          })
                  elif path == "/text":
                      self.send(b'{"message":"login required"}', "application/json")
                  else:
                      self.send(b"missing", "text/plain", 404)


          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          args.port_file.parent.mkdir(parents=True, exist_ok=True)
          args.port_file.write_text(str(server.server_address[1]))
          server.serve_forever()
          '''

          source = Path("MuseHook.m").read_text(encoding="utf-8")
          player_start = source.index("// ───────────────────────── 播放器抓取")
          bootstrap_start = source.index("// ───────────────────────── 入口", player_start)
          download_start = source.index("// ───────────────────────── 下载器")
          ui_start = source.index("// ───────────────────────── 列表 UI", download_start)
          target = Path(os.environ["RUNNER_TEMP"]) / "musehook-player-tests"
          target.mkdir(parents=True, exist_ok=True)
          (target / "player-capture.inc").write_text(source[player_start:bootstrap_start], encoding="utf-8")
          (target / "download-core.inc").write_text(source[download_start:ui_start], encoding="utf-8")
          (target / "player-capture-tests.m").write_text(player_test, encoding="utf-8")
          (target / "download-core-tests.m").write_text(download_test, encoding="utf-8")
          (target / "download-fixture-server.py").write_text(server, encoding="utf-8")
          PY
          TEST_DIR="$RUNNER_TEMP/musehook-player-tests"
          xcrun clang -fobjc-arc -framework Foundation "$TEST_DIR/player-capture-tests.m" -o "$TEST_DIR/player-capture-tests"
          "$TEST_DIR/player-capture-tests"
          xcrun clang -fobjc-arc -framework Foundation "$TEST_DIR/download-core-tests.m" -o "$TEST_DIR/download-core-tests"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import time

          target = Path(os.environ["RUNNER_TEMP"]) / "musehook-player-tests"
          port_file = target / "server-port"
          fixture_dir = target / "fixtures"
          output_dir = target / "downloads"
          process = subprocess.Popen(["python3", str(target / "download-fixture-server.py"),
                                      "--fixtures", str(fixture_dir), "--port-file", str(port_file)])
          try:
              for attempt in range(100):
                  if port_file.exists():
                      break
                  if process.poll() is not None:
                      raise RuntimeError("Fixture server exited before startup")
                  time.sleep(0.1)
              else:
                  raise RuntimeError("Fixture server did not start")
              base = "http://127.0.0.1:" + port_file.read_text().strip()
              subprocess.run([str(target / "download-core-tests"), base, str(fixture_dir), str(output_dir)],
                             check=True, timeout=120)
          finally:
              process.terminate()
              process.wait(timeout=10)
          PY


      - name: Build dylib (arm64)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -dynamiclib \
            -O2 \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework CoreFoundation \
            -o MuseHook.dylib \
            MuseHook.m
          ls -lh MuseHook.dylib
          file MuseHook.dylib

      - name: Ad-hoc sign
        run: |
          brew install ldid >/dev/null 2>&1 || true
          ldid -S MuseHook.dylib || echo "ldid failed, TrollFools 会自己签"
          otool -L MuseHook.dylib || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MuseHook-dylib
          path: MuseHook.dylib
          retention-days: 30
