          download_test = r'''
          #import <Foundation/Foundation.h>
          #include <CommonCrypto/CommonCryptor.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdarg.h>
          #include <string.h>

          typedef NS_ENUM(NSInteger, CandStatus) { CandIdle, CandRunning, CandDone, CandFailed };
          @interface MuseCandidate : NSObject
          @property (atomic, copy) NSString *url;
          @property (atomic, copy) NSString *title;
          @property (atomic, copy) NSDictionary *headers;
          @property (atomic, copy) NSString *errorText;
          @property (atomic, copy) NSString *outputPath;
          @property (atomic, assign) CandStatus status;
          @property (atomic, assign) double progress;
          @property (atomic, assign) BOOL isFmp4;
          @property (atomic, assign) double bytesPerSecond;
          @property (atomic, assign) NSUInteger connections;
          @end
          @implementation MuseCandidate
          @end

          static NSString *testOutputRoot;
          static NSLock *gLock;
          static MuseCandidate *gProgressCandidate;
          static NSMutableArray<NSNumber *> *gProgressSamples;
          static NSString *out_dir(void) { return testOutputRoot; }
          static void notify_list_changed(void) {
              if (!gProgressCandidate || !gProgressSamples) return;
              @synchronized (gProgressSamples) {
                  [gProgressSamples addObject:@(gProgressCandidate.progress)];
              }
          }
          static void mlog(NSString *format, ...) {
              va_list arguments;
              va_start(arguments, format);
              NSString *message = [[NSString alloc] initWithFormat:format arguments:arguments];
              va_end(arguments);
              fprintf(stderr, "%s\n", message.UTF8String);
          }

          #include "download-core.inc"

          static void require(BOOL condition, NSString *message) {
              if (!condition) { fprintf(stderr, "FAIL: %s\n", message.UTF8String); exit(1); }
          }

          static NSData *box(const char *type, NSData *payload) {
              uint32_t length = (uint32_t)payload.length + 8;
              unsigned char header[8] = {
                  (unsigned char)(length >> 24), (unsigned char)(length >> 16),
                  (unsigned char)(length >> 8), (unsigned char)length, 0, 0, 0, 0
              };
              memcpy(header + 4, type, 4);
              NSMutableData *data = [NSMutableData dataWithBytes:header length:8];
              [data appendData:payload];
              return data;
          }

          static NSData *joined(NSArray<NSData *> *parts) {
              NSMutableData *data = [NSMutableData data];
              for (NSData *part in parts) [data appendData:part];
              return data;
          }

          static NSData *transport(unsigned char fill) {
              NSMutableData *data = [NSMutableData dataWithLength:188 * 2];
              memset(data.mutableBytes, fill, data.length);
              ((unsigned char *)data.mutableBytes)[0] = 0x47;
              ((unsigned char *)data.mutableBytes)[188] = 0x47;
              return data;
          }

          static NSData *encrypted(NSData *clear, NSData *key, uint64_t sequence) {
              unsigned char iv[16] = {0};
              for (int index = 15; index >= 8; index--) { iv[index] = (unsigned char)sequence; sequence >>= 8; }
              NSMutableData *cipher = [NSMutableData dataWithLength:clear.length + 16];
              size_t count = 0;
              CCCryptorStatus status = CCCrypt(kCCEncrypt, kCCAlgorithmAES128, kCCOptionPKCS7Padding,
                                               key.bytes, key.length, iv, clear.bytes, clear.length,
                                               cipher.mutableBytes, cipher.length, &count);
              require(status == kCCSuccess, @"generate AES fixture");
              cipher.length = count;
              return cipher;
          }

          static MuseCandidate *download(NSString *base, NSString *path, NSString *title, NSDictionary *headers) {
              MuseCandidate *candidate = [MuseCandidate new];
              candidate.url = [base stringByAppendingString:path];
              candidate.title = title;
              candidate.headers = headers ?: @{};
              if ([title isEqualToString:@"resume"]) {
                  gProgressCandidate = candidate;
                  gProgressSamples = [NSMutableArray new];
              }
              [[MuseDl shared] downloadCandidate:candidate];
              return candidate;
          }

          static NSArray<NSString *> *finalFiles(NSString *title) {
              NSString *directory = testOutputRoot;
              NSMutableArray *paths = [NSMutableArray array];
              for (NSString *name in [NSFileManager.defaultManager contentsOfDirectoryAtPath:directory error:NULL]) {
                  NSString *stem = name.stringByDeletingPathExtension;
                  BOOL matchingName = [stem isEqualToString:title] || [stem hasPrefix:[title stringByAppendingString:@" ("]];
                  if (matchingName && [@[@"ts", @"mp4"] containsObject:name.pathExtension])
                      [paths addObject:[directory stringByAppendingPathComponent:name]];
              }
              return paths;
          }

          static void expectSuccess(MuseCandidate *candidate, NSData *expected) {
              require(candidate.status == CandDone && candidate.progress == 1, candidate.errorText ?: @"download status");
              NSArray *files = finalFiles(candidate.title);
              require(files.count == 1, @"one complete published file");
              NSData *actual = [NSData dataWithContentsOfFile:files.firstObject];
              require([actual isEqual:expected], [@"downloaded bytes mismatch: " stringByAppendingString:candidate.title]);
          }

          static void expectFailure(MuseCandidate *candidate) {
              require(candidate.status == CandFailed && candidate.errorText.length && candidate.progress == 0, @"failure state/error");
              require(finalFiles(candidate.title).count == 0, @"failed download published a media file");
          }

          int main(int argc, const char *argv[]) {
              @autoreleasepool {
                  require(argc == 4, @"arguments: base URL, fixtures directory, output directory");
                  NSString *base = [NSString stringWithUTF8String:argv[1]];
                  NSString *fixtures = [NSString stringWithUTF8String:argv[2]];
                  testOutputRoot = [NSString stringWithUTF8String:argv[3]];
                  gLock = [NSLock new];
                  [NSFileManager.defaultManager createDirectoryAtPath:fixtures withIntermediateDirectories:YES attributes:nil error:NULL];
                  [NSFileManager.defaultManager createDirectoryAtPath:testOutputRoot withIntermediateDirectories:YES attributes:nil error:NULL];
                  NSData *first = transport(0x11);
                  NSData *second = transport(0x22);
                  NSData *expectedTS = joined(@[first, second]);
                  [first writeToFile:[fixtures stringByAppendingPathComponent:@"ts0.bin"] atomically:YES];
                  [second writeToFile:[fixtures stringByAppendingPathComponent:@"ts1.bin"] atomically:YES];
                  NSData *type = box("ftyp", [@"isom0000" dataUsingEncoding:NSASCIIStringEncoding]);
                  NSData *movie = box("moov", NSData.data);
                  NSData *media = box("mdat", [@"synthetic media fixture" dataUsingEncoding:NSASCIIStringEncoding]);
                  NSData *mp4 = joined(@[type, movie, media]);
                  [mp4 writeToFile:[fixtures stringByAppendingPathComponent:@"movie.mp4"] atomically:YES];
                  require([muse_video_basename(@"https://46e9nz.mfpt8g.com/one/original/LXT/MIDV-530-LXT.mp4?token=a%2Fb")
                           isEqualToString:@"MIDV-530-LXT"], @"URL-derived requested filename");
                  require([muse_video_basename(@"http://localhost:6001/parse?url=https%3A%2F%2Fcdn.example%2FMIDV-530-LXT.mp4")
                           isEqualToString:@"MIDV-530-LXT"], @"filename inside playback proxy URL");
                  require(muse_video_basename(@"https://cdn.example/index.m3u8") == nil, @"generic playlist fallback name");
                  NSData *large = joined(@[type, movie, box("mdat", [NSMutableData dataWithLength:24 * 1024 * 1024])]);
                  [large writeToFile:[fixtures stringByAppendingPathComponent:@"large.mp4"] atomically:YES];
                  NSData *resumable = joined(@[type, movie, box("mdat", [NSMutableData dataWithLength:2 * 1024 * 1024])]);
                  [resumable writeToFile:[fixtures stringByAppendingPathComponent:@"resume.mp4"] atomically:YES];
                  NSData *initialization = joined(@[type, movie]);
                  NSData *fragment0 = joined(@[box("moof", NSData.data), box("mdat", first)]);
                  NSData *fragment1 = joined(@[box("moof", NSData.data), box("mdat", second)]);
                  [initialization writeToFile:[fixtures stringByAppendingPathComponent:@"init.bin"] atomically:YES];
                  [fragment0 writeToFile:[fixtures stringByAppendingPathComponent:@"fragment0.bin"] atomically:YES];
                  [fragment1 writeToFile:[fixtures stringByAppendingPathComponent:@"fragment1.bin"] atomically:YES];
                  NSData *expectedMP4 = joined(@[initialization, fragment0, fragment1]);
                  unsigned char keyBytes[16];
                  for (int index = 0; index < 16; index++) keyBytes[index] = (unsigned char)index;
                  NSData *key = [NSData dataWithBytes:keyBytes length:16];
                  [key writeToFile:[fixtures stringByAppendingPathComponent:@"key.bin"] atomically:YES];
                  [encrypted(first, key, 123456789012) writeToFile:[fixtures stringByAppendingPathComponent:@"encrypted0.bin"] atomically:YES];
                  [encrypted(second, key, 123456789013) writeToFile:[fixtures stringByAppendingPathComponent:@"encrypted1.bin"] atomically:YES];

                  expectSuccess(download(base, @"/redirect/start.m3u8", @"redirect", nil), expectedTS);
                  expectSuccess(download(base, @"/headers/list.m3u8", @"headers",
                                         @{@"Authorization": @"Bearer fixture", @"User-Agent": @"FixturePlayer"}), first);
                  expectFailure(download(base, @"/headers/list.m3u8", @"headers-denied", nil));
                  expectSuccess(download(base, @"/mp4", @"direct", nil), mp4);
                  MuseCandidate *named = download(base, @"/names/MIDV-530-LXT.mp4?token=fixture", @"候选 99", nil);
                  require(named.status == CandDone, named.errorText ?: @"named download completed");
                  NSString *namedPath = [testOutputRoot stringByAppendingPathComponent:@"MIDV-530-LXT.mp4"];
                  require([[NSData dataWithContentsOfFile:namedPath] isEqual:mp4], @"published video filename uses URL stem");
                  BOOL folder = NO;
                  require(![NSFileManager.defaultManager fileExistsAtPath:[testOutputRoot stringByAppendingPathComponent:@"MIDV-530-LXT"]
                                                             isDirectory:&folder], @"no per-video output folder");
                  require(![NSFileManager.defaultManager fileExistsAtPath:[testOutputRoot stringByAppendingPathComponent:@"候选 99"]
                                                             isDirectory:&folder], @"no candidate output folder");
                  NSString *moduleTitle = @"[LTX]新有菜 黑丝封神之作";
                  MuseCandidate *moduleNamed = download(base, @"/names/MIDV-530-LXT.mp4?title=module", moduleTitle, nil);
                  expectSuccess(moduleNamed, mp4);
                  NSString *modulePath = [testOutputRoot stringByAppendingPathComponent:[moduleTitle stringByAppendingPathExtension:@"mp4"]];
                  require([[NSData dataWithContentsOfFile:modulePath] isEqual:mp4], @"module title overrides URL basename");
                  require([moduleNamed.outputPath isEqualToString:modulePath], @"diagnostics report actual saved module-title path");
                  require(muse_display_title(@"候选 1") == nil, @"placeholder title falls back to URL basename");
                  require([muse_display_title(@"  模块标题  ") isEqualToString:@"模块标题"], @"display title whitespace trimmed");
                  expectSuccess(download(base, @"/aes/list.m3u8", @"aes", nil), expectedTS);
                  expectFailure(download(base, @"/broken/list.m3u8", @"missing", nil));
                  expectFailure(download(base, @"/false/list.m3u8", @"false-200", nil));
                  expectSuccess(download(base, @"/range/list.m3u8", @"range", nil), expectedMP4);
                  expectSuccess(download(base, @"/range-ignore/list.m3u8", @"range-ignore", nil), expectedMP4);
                  expectFailure(download(base, @"/range-wrong/list.m3u8", @"range-wrong", nil));
                  expectFailure(download(base, @"/text", @"not-media", nil));
                  MuseCandidate *one = download(base, @"/mp4?one", @"collision", nil);
                  MuseCandidate *two = download(base, @"/mp4?two", @"collision", nil);
                  require(one.status == CandDone && two.status == CandDone && finalFiles(@"collision").count == 2,
                          @"completed files must be preserved on filename collision");
                  MuseCandidate *parallel = download(base, @"/parallel.mp4", @"parallel", nil);
                  expectSuccess(parallel, large);
                  require(parallel.connections == 6, @"six concurrent range transfers");
                  NSString *peak = [NSString stringWithContentsOfFile:[fixtures stringByAppendingPathComponent:@"parallel-peak"]
                                                            encoding:NSUTF8StringEncoding error:NULL];
                  require(peak.integerValue >= 2, @"server observed concurrent requests");
                  expectSuccess(download(base, @"/resume", @"resume", nil), resumable);
                  @synchronized (gProgressSamples) {
                      double previous = 0;
                      for (NSNumber *sample in gProgressSamples) {
                          require(sample.doubleValue >= previous, @"download progress moved backwards");
                          previous = sample.doubleValue;
                      }
                  }
                  NSString *ranges = [NSString stringWithContentsOfFile:[fixtures stringByAppendingPathComponent:@"resume-ranges.jsonl"]
                                                              encoding:NSUTF8StringEncoding error:NULL];
                  NSUInteger requests = 0;
                  NSUInteger restarts = 0;
                  for (NSString *line in [ranges componentsSeparatedByString:@"\n"]) {
                      if (!line.length) continue;
                      NSDictionary *entry = [NSJSONSerialization JSONObjectWithData:[line dataUsingEncoding:NSUTF8StringEncoding] options:0 error:NULL];
                      requests++;
                      if ([entry[@"start"] unsignedLongLongValue] == 0) restarts++;
                  }
                  require(requests >= 6 && restarts == 1, @"retries used resume offsets rather than restarting");
                  puts("PASS: six-way range downloading, repeated interruption resume and monotonic progress");
                  puts("PASS: URL-derived MIDV-530-LXT.mp4 filename and proxy/generic naming");
                  for (NSString *name in [NSFileManager.defaultManager contentsOfDirectoryAtPath:testOutputRoot error:NULL]) {
                      BOOL isDirectory = NO;
                      [NSFileManager.defaultManager fileExistsAtPath:[testOutputRoot stringByAppendingPathComponent:name] isDirectory:&isDirectory];
                      require(!isDirectory, @"download root contains no temporary or per-video folders");
                  }
                  puts("PASS: completed videos saved directly in download root");
                  puts("PASS: module display title preferred over media URL filename");
                  puts("PASS: download fixtures (redirects, headers, MP4, AES sequence, missing pieces, ranges, false-200 and file publication)");
              }
              return 0;
          }
          '''

          one_test = r'''
          #import <Foundation/Foundation.h>
          #include <CommonCrypto/CommonCryptor.h>
          #include <CommonCrypto/CommonDigest.h>
          #include <math.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <limits.h>

          #include "one-check-core.inc"

          static void require_one(BOOL condition, NSString *message) {
              if (!condition) {
                  fprintf(stderr, "FAIL: %s\n", message.UTF8String);
                  exit(1);
              }
          }

          static NSString *fixture_token(NSDictionary *payload) {
              NSData *data = [NSJSONSerialization dataWithJSONObject:payload options:0 error:nil];
              NSString *encoded = [[[data base64EncodedStringWithOptions:0]
                  stringByReplacingOccurrencesOfString:@"+" withString:@"-"] stringByReplacingOccurrencesOfString:@"/" withString:@"_"];
              encoded = [encoded stringByReplacingOccurrencesOfString:@"=" withString:@""];
              return [NSString stringWithFormat:@"eyJhbGciOiJub25lIn0.%@.synthetic-signature", encoded];
          }

          int main(int argc, const char *argv[]) {
              @autoreleasepool {
                  require_one(argc == 2, @"local fixture URL supplied");
                  NSDate *now = [NSDate dateWithTimeIntervalSince1970:1793574000];
                  NSString *uuid = @"11111111-2222-4333-8444-555555555555";
                  NSString *token = fixture_token(@{@"uuid": uuid, @"exp": @1793574001, @"iss": @"private-account"});
                  NSString *expired = fixture_token(@{@"uuid": uuid, @"exp": @1793574000});
                  require_one([muse_one_token_state(nil, now) isEqualToString:@"未获取"], @"absent credentials distinguished");
                  require_one([muse_one_token_state(@"not-a-jwt", now) isEqualToString:@"格式无效"], @"invalid credentials distinguished");
                  require_one(muse_one_payload(@"header.%%%.signature") == nil, @"invalid base64 rejected");
                  require_one(muse_one_payload([token stringByAppendingString:@"\r\n"]) == nil, @"header injection rejected");
                  require_one(muse_one_probe_request(fixture_token(@{@"uuid": @"x\r\ny"}), @"1793574000") == nil,
                              @"control characters in the credential UUID rejected");
                  NSString *state = muse_one_token_state(token, now);
                  require_one([state containsString:@"本地有效期未过"] && [state containsString:@"UUID 存在"], @"local expiry and UUID presence reported");
                  require_one(![state containsString:uuid] && ![state containsString:@"private-account"] && ![state containsString:token], @"credential values absent from reports");
                  require_one([muse_one_token_state(expired, now) containsString:@"已过期"], @"expiry boundary rejected");
                  require_one([muse_one_token_state(fixture_token(@{}), now) containsString:@"UUID 缺失"], @"missing matching UUID reported");

                  NSString *suite = [@"MuseHook.OneTest." stringByAppendingString:NSUUID.UUID.UUIDString];
                  NSUserDefaults *defaults = [[NSUserDefaults alloc] initWithSuiteName:suite];
                  [defaults setObject:[@"Bearer " stringByAppendingString:token] forKey:@"flutter.token_one"];
                  require_one([muse_one_token(defaults, @"token_one") isEqualToString:token], @"Flutter-prefixed credential and Bearer prefix read");
                  [defaults setObject:@123 forKey:@"flutter.token_one_visitor"];
                  require_one(muse_one_token(defaults, @"token_one_visitor") == nil, @"invalid preference type rejected");
                  [defaults removePersistentDomainForName:suite];

                  NSMutableURLRequest *request = muse_one_probe_request(token, @"1793574000");
                  require_one([request.HTTPMethod isEqualToString:@"POST"], @"navigation method preserved");
                  require_one([[request valueForHTTPHeaderField:@"user-key"] isEqualToString:@""], @"empty user-key retained");
                  require_one([[request valueForHTTPHeaderField:@"uuid"] isEqualToString:uuid], @"UUID comes from the supplied credential");
                  require_one([[request valueForHTTPHeaderField:@"sign"] isEqualToString:@"21213419c76ddd53f388fa0d70d76f13"], @"signature matches independent golden fixture");

                  MuseOneProbeDelegate *delegate = [MuseOneProbeDelegate new];
                  __block NSURLRequest *redirected = request;
                  [delegate URLSession:nil task:nil willPerformHTTPRedirection:nil
                      newRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:@"https://other.example/steal"]]
                      completionHandler:^(NSURLRequest *next) { redirected = next; }];
                  require_one(redirected == nil, @"credentials cannot follow a redirect to another host");

                  NSString *sensitive = [NSString stringWithFormat:@"expired %@ Bearer %@ token=not-for-the-report", token, token];
                  NSString *safe = muse_one_safe_message(sensitive);
                  require_one(![safe containsString:token] && ![safe containsString:@"not-for-the-report"], @"server messages redact credential material");
                  require_one(![muse_one_safe_message(uuid) containsString:uuid], @"server-echoed UUID redacted");
                  NSData *errorJSON = [@"{\"code\":401,\"message\":\"expired\"}" dataUsingEncoding:NSUTF8StringEncoding];
                  require_one([muse_one_response_json(errorJSON)[@"code"] integerValue] == 401, @"plain HTTP error body decoded");
                  NSData *encryptedError = [@"\"U6S15BTUHatEKH8seeEs/IQDTgt/SEuEOacjD9WsDbDWTqjjox4vknp3Qi01GxOL\""
                      dataUsingEncoding:NSUTF8StringEncoding];
                  require_one([muse_one_response_json(encryptedError)[@"message"] isEqualToString:@"expired"],
                              @"encrypted API error decoded from an independent AES fixture");
                  const unsigned char invalid[] = {0xff, 0xfe, 0xfd};
